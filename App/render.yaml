# Render Blueprint: New + > Blueprint > connect your repo. Creates the API and a Postgres database.
# Use paid plans in production: the free web service sleeps (30-60s cold start) and free Postgres expires.
databases:
  - name: sugar-detox-db
    plan: basic-256mb
    databaseName: sugardetox
    user: sugardetox

services:
  - type: web
    name: sugar-detox-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sugar-detox-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: COMPANY_NAME
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
